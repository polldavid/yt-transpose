name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/youtube-song-transposer-bq961f
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # postinstall copies the SoundTouchJS browser build into public/vendor
      - run: npm install
      - run: mkdir -p _site && cp -r public/. _site/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          allow_empty_commit: true
      # Pushes made with GITHUB_TOKEN do not trigger GitHub's Pages build
      # (anti-recursion rule), so without this the site never picks up the
      # new gh-pages commit. Explicitly request a build via the API.
      - run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
