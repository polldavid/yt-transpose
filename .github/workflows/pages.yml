name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/youtube-song-transposer-bq961f
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # postinstall copies the SoundTouchJS browser build into public/vendor
      - run: npm install
      - run: mkdir -p _site && cp -r public/. _site/
      # Publishing to a gh-pages branch auto-enables GitHub Pages on the repo,
      # which the actions-based Pages deploy can't do with the default token.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
