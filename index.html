<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1117" />
  <title>YT Transpose — change the key of any YouTube song</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>YT&nbsp;Transpose</h1>
      <p class="tagline">Paste a YouTube link, shift the key, play along.</p>
    </header>

    <form id="url-form" class="url-form" autocomplete="off">
      <input
        id="url-input"
        type="url"
        inputmode="url"
        placeholder="https://www.youtube.com/watch?v=…"
        aria-label="YouTube link"
        required
      />
      <button type="submit" id="load-btn">Load</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <section id="player" class="player hidden">
      <div class="track">
        <img id="thumb" class="thumb" alt="" />
        <div class="track-meta">
          <h2 id="title"></h2>
          <p id="author"></p>
        </div>
      </div>

      <div class="transpose">
        <button id="pitch-down" class="round-btn" aria-label="Transpose down one semitone">−</button>
        <div class="pitch-display">
          <span id="pitch-value">0</span>
          <span class="pitch-label">semitones</span>
        </div>
        <button id="pitch-up" class="round-btn" aria-label="Transpose up one semitone">+</button>
      </div>
      <button id="pitch-reset" class="link-btn">reset key</button>

      <div class="tempo">
        <label for="tempo-slider">Speed <span id="tempo-value">1.00×</span></label>
        <input id="tempo-slider" type="range" min="50" max="150" value="100" step="1" />
      </div>

      <div class="transport">
        <button id="play-btn" class="play-btn" aria-label="Play">
          <svg id="icon-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" class="hidden"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <div class="seek">
          <input id="seek-slider" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
          <div class="times">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>Pitch is shifted without changing speed. For personal practice use.</p>
    </footer>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
